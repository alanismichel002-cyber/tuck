<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Tuck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</head>
<body>
<div id="config-banner" class="banner" hidden>Supabase isn't set up yet. Add your Project URL and anon key to config.js.</div>
<div class="wrap">
  <nav class="nav">
    <a class='brand' href='/'>
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M6 12h24v10a8 8 0 0 1-8 8h-8a8 8 0 0 1-8-8V12z" stroke="#8C2155" stroke-width="2.5" stroke-linejoin="round"/><path d="M18 16s-6.5-3.8-6.5-8A3.3 3.3 0 0 1 18 6.2 3.3 3.3 0 0 1 24.5 8c0 4.2-6.5 8-6.5 8z" fill="#F28CB5"/></svg>
      <span>tuck</span>
    </a>
  </nav>

  <main class="auth-page">
    <div class="card">
      <h1 id="title">Welcome back</h1>
      <p class="sub" id="subtitle">Use Google, or log in with email and password.</p>
      <div id="msg" class="msg" role="status" hidden></div>
      <button id="google-btn" type="button" class="btn btn-google">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        <span id="google-text">Continue with Google</span>
      </button>
      <div class="divider"><span>or use email</span></div>
      <form id="auth-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required placeholder="you@school.edu">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required minlength="6">
          <small id="pw-hint" hidden>At least 6 characters.</small>
        </div>
        <button id="submit" type="submit" class="btn btn-plum">Log in</button>
      </form>
      <p class="switch"><span id="switch-text">New to Tuck?</span> <button type="button" id="switch-btn" class="linkbtn">Create an account</button></p>
    </div>
  </main>
</div>

<script>
(async function () {
  var mode = new URLSearchParams(location.search).get('mode') === 'signup' ? 'signup' : 'login';
  var form = document.getElementById('auth-form');
  var msg = document.getElementById('msg');
  var submit = document.getElementById('submit');
  var pw = document.getElementById('password');

  if (!window.tuckConfigured) document.getElementById('config-banner').hidden = false;

  // Google sends people back here with an error if they cancel or something fails.
  var back = new URLSearchParams(location.search + '&' + location.hash.slice(1));
  if (back.get('error_description')) showMsg(msg, 'Google sign-in failed: ' + back.get('error_description'), 'error');

  // Already logged in? Go straight to the profile.
  if (await getUser()) { location.replace('profile.html'); return; }

  function render() {
    var signup = mode === 'signup';
    document.getElementById('title').textContent = signup ? 'Create your account' : 'Welcome back';
    document.getElementById('subtitle').textContent = signup ? 'Use Google, or sign up with email and a password.' : 'Use Google, or log in with email and password.';
    submit.textContent = signup ? 'Create account' : 'Log in';
    document.getElementById('switch-text').textContent = signup ? 'Already have an account?' : 'New to Tuck?';
    document.getElementById('switch-btn').textContent = signup ? 'Log in' : 'Create an account';
    document.getElementById('pw-hint').hidden = !signup;
    pw.autocomplete = signup ? 'new-password' : 'current-password';
    document.getElementById('google-text').textContent = signup ? 'Sign up with Google' : 'Continue with Google';
    if (!back.get('error_description')) showMsg(msg, '');
  }

  // "Continue with Google": Supabase sends the user to Google, then back to profile.html.
  // New Google users get an account (and a profile row) automatically.
  document.getElementById('google-btn').addEventListener('click', async function () {
    if (!sb) { showMsg(msg, 'Supabase is not configured yet (see config.js).', 'error'); return; }
    this.disabled = true;
    var res = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: new URL('profile.html', location.href).href,
        queryParams: { prompt: 'select_account' }
      }
    });
    if (res.error) { showMsg(msg, res.error.message, 'error'); this.disabled = false; }
  });

  document.getElementById('switch-btn').addEventListener('click', function () {
    mode = mode === 'signup' ? 'login' : 'signup';
    render();
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!sb) { showMsg(msg, 'Supabase is not configured yet (see config.js).', 'error'); return; }

    var email = document.getElementById('email').value.trim();
    var password = pw.value;
    if (!email || email.indexOf('@') < 1) { showMsg(msg, 'Enter a valid email address.', 'error'); return; }
    if (password.length < 6) { showMsg(msg, 'Password must be at least 6 characters.', 'error'); return; }

    submit.disabled = true;
    try {
      var res = mode === 'signup'
        ? await sb.auth.signUp({ email: email, password: password })
        : await sb.auth.signInWithPassword({ email: email, password: password });

      if (res.error) { showMsg(msg, res.error.message, 'error'); return; }

      if (res.data.session) {
        location.href = 'profile.html';
      } else {
        // Happens only if "Confirm email" is turned on in Supabase.
        showMsg(msg, 'Account created. Check your email to confirm, then log in.', 'ok');
      }
    } catch (err) {
      showMsg(msg, 'Something went wrong. Check your connection and try again.', 'error');
    } finally {
      submit.disabled = false;
    }
  });

  render();
})();
</script>
</body>
</html>
